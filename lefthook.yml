min_version: 2.1.10

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{js,jsx,ts,tsx,json,jsonc,yaml,yml,md,css,scss,html}"
      run: bunx oxfmt --write {staged_files}
      stage_fixed: true
    lint:
      glob: "{src,scripts}/**/*.{js,jsx,ts,tsx}"
      run: bunx oxlint --deny-warnings {staged_files}

pre-push:
  parallel: true
  commands:
    modules:
      run: bun run modules:check
    typecheck:
      run: bun run typecheck
    test:
      run: bun run test
    build:
      run: bun run build
