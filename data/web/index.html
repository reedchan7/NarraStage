<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#101217" />
    <meta
      name="description"
      content="NarraStage — 从故事、脚本、画面到成片的一体化 AI 创作工作台"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23edb34f'/%3E%3Cpath d='M18 17h28v30H18zM24 23h16v18H24z' fill='%231c1508' fill-rule='evenodd'/%3E%3C/svg%3E"
    />
    <title>NarraStage</title>
    <script>
      (function () {
        var theme = "dark";
        try {
          var raw = localStorage.getItem("narrastage.preferences.v2");
          if (raw) {
            var stored = JSON.parse(raw).state.theme;
            if (stored === "light" || stored === "dark" || stored === "system") theme = stored;
          }
        } catch {}
        var resolved =
          theme === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : theme;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
